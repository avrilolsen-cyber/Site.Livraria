<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Livraria - Entrar / Cadastrar</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main class="conteudo-principal">
    <div id="tela-cadastro" class="container-formulario">
        <div class="caixa-intera">
            <h2 class="welcome-text">BEM-VINDO À LIVRARIA</h2>
            <h1 class="titulo-formulario">Cadastre-se<h1>
            
            <form class="login-form">
                <div class="input-group">
                    <input type="email" placeholder="email" required>
                </div>
                <div class="input-group password-group">
                    <input type="password" placeholder="password" required>
                    <span class="toggle-password">👁️</span>
                </div>
                
                <p class="signup-text">
                    Ainda não criou sua conta? <a href="#" class="signup-link">Cadastre-se</a>
                </p>
            </form>
        </div>
    </div>
     
</body>
</html>
